<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../../images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>עריכת ספק</title>
  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="../../../header/header.css" />
    <script src="../../../scripts/auth.js"></script>

</head>
<body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../../header/header.js"></script>

<main>
  <div class="page-title-row">
    <div>
      <h1>עריכת ספק</h1>
      <p>עדכון פרטי הספק</p>
    </div>
  </div>

  <form id="editSupplierForm">
    <div class="form-group">
      <label>שם ספק</label>
      <input type="text" id="supplierName" placeholder="שם הספק" required />
    </div>
    <div class="form-group">
      <label>אתר אינטרנט</label>
      <input type="text" id="websiteUrl" placeholder="https://example.com" />
    </div>
    <button type="submit" class="button-add" id="saveBtn">שמור</button>
      <div id="loader" class="loader">
          <label>טוען</label>
          <img src="../../../images/loader.gif" style="width:40px;" />
      </div>
  </form>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../../config.js"></script>
<script src="../../../scripts/ajaxCalls.js"></script>
<script src="editSupplier.js"></script>
</body>
</html>
