<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>רכיבים</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../header/header.css" />
</head>
<body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../scripts/auth.js"></script>
<script src="../../header/header.js"></script>

<main>
  <div class="page-title-row">
    <div>
      <h1>רכיבים</h1>
      <p>רשימת כל הרכיבים והרכיבים במערכת</p>
    </div>
    <button class="button-add" onclick="window.location.href='new'">+ הוספת רכיב</button>
  </div>

  <div class="search-wrapper">
    <img src="../../images/search.png" alt="" class="search-icon" />
    <input type="text" id="searchInput" placeholder="חיפוש לפי תיאור רכיב..." />
  </div>

  <div id="componentsContainer"></div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../config.js"></script>
<script src="../../scripts/ajaxCalls.js"></script>
<div id="editComponentModal" class="edit-modal-overlay">
  <div class="edit-modal">
    <button class="modal-close" id="closeComponentModal">&times;</button>
    <h2>עריכת רכיב</h2>
    <form id="editComponentForm">
      <input type="hidden" id="editOriginalSKU" />
      <div class="form-group">
        <label>מק"ט</label>
        <input type="text" id="editSKU" required />
      </div>
      <div class="form-group">
        <label>תיאור</label>
        <input type="text" id="editDescription" required />
      </div>
      <div class="form-group">
        <label>יחידת בסיס</label>
        <input type="text" id="editBaseUnit" />
      </div>
      <div class="form-group">
        <label>מק"ט חלופי</label>
        <input type="text" id="editAlternativeSKU" />
      </div>
      <button type="submit" class="button-add">שמור</button>
    </form>
  </div>
</div>

<script src="components.js"></script>
<script>if (!isAdminOrManager()) { $('.button-add, .icon-delete, .icon-edit').hide(); }</script>
</body>
</html>
